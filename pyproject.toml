[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bernini-v2-t8"
version = "0.2.1"
description = "Native ComfyUI nodes for ByteDance Bernini-Diffusers-v2"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["comfyui", "bernini", "video-generation", "video-editing", "quantization"]
dependencies = [
  "safetensors>=0.4.3",
]
classifiers = [
  "Operating System :: OS Independent",
  "Environment :: GPU :: NVIDIA CUDA",
]

[project.urls]
Repository = "https://github.com/T8mars/comfyui-bernini-v2-T8"
Documentation = "https://github.com/T8mars/comfyui-bernini-v2-T8#readme"
Issues = "https://github.com/T8mars/comfyui-bernini-v2-T8/issues"

[tool.comfy]
PublisherId = "t8star"
DisplayName = "Bernini v2 (Native)"
requires-comfyui = ">=0.33.0"

[project.optional-dependencies]
download = ["huggingface-hub>=0.36"]
test = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
